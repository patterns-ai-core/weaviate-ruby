name: Tests

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler: default
          bundler-cache: true

      - name: StandardRb check
        run: bundle exec standardrb --format progress --format github --color

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    env:
      # standard requires Ruby >= 3.0, linting runs in its own job
      BUNDLE_WITHOUT: lint

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true

      - name: Run tests
        run: |
          bundle exec rspec
  docs:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler: default
          bundler-cache: true
      - name: Build docs
        run: bundle exec rake yard
